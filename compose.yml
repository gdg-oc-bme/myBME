services:
  db:
    image: postgres:18
    container_name: postgres-dev
    environment:
      POSTGRES_USER: myBME_user
      POSTGRES_PASSWORD: myBME-password
      POSTGRES_DB: myBME_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myBME_user -d myBME_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
